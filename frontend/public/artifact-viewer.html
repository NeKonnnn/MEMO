<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Просмотр артефакта — AstraChat</title>
  <!-- Локальный mermaid (копируется prebuild), без внешнего CDN -->
  <script src="/static/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e8eaed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #1f2937;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 650;
    }
    .meta {
      margin: 0 0 16px;
      font-size: 0.8rem;
      color: #6b7280;
    }
    #stage {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px;
      min-height: 280px;
      overflow: auto;
    }
    #stage.svg-only {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }
    #stage svg { max-width: 100%; height: auto; }
    #stage pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    #error {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    iframe.fill {
      width: 100%;
      min-height: 70vh;
      border: 0;
      border-radius: 8px;
      background: #fff;
      display: block;
    }
    iframe.fullpage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap" id="chrome">
    <h1 id="title">Артефакт</h1>
    <p class="meta" id="meta"></p>
    <div id="error"></div>
    <div id="stage"></div>
  </div>
  <script>
    (function () {
      var STORAGE_PREFIX = 'astrachat:artifact:';
      var params = new URLSearchParams(location.search);
      var key = params.get('key');
      var errorEl = document.getElementById('error');
      var stage = document.getElementById('stage');
      var titleEl = document.getElementById('title');
      var metaEl = document.getElementById('meta');
      var chrome = document.getElementById('chrome');

      function showError(msg) {
        errorEl.style.display = 'block';
        errorEl.textContent = msg;
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function stripMermaidJunk(code) {
        code = String(code || '').replace(/\r\n/g, '\n').trim();
        code = code.replace(/^```(?:mermaid)?\s*/i, '').replace(/\s*```$/i, '');
        code = code
          .split('\n')
          .filter(function (line) {
            var t = line.trim();
            if (/^`{3,}/.test(t)) return false;
            // CSS-style в mermaid ломает парсер
            if (/^style\s+/i.test(t) && /(text-align|font-weight|font-size|font-family)/i.test(t)) {
              return false;
            }
            return true;
          })
          .join('\n')
          .trim();
        return code;
      }

      if (!key) {
        showError('Не указан ключ артефакта.');
        return;
      }

      var raw;
      try {
        raw = localStorage.getItem(STORAGE_PREFIX + key);
      } catch (e) {
        showError('Не удалось прочитать localStorage.');
        return;
      }
      if (!raw) {
        showError('Артефакт не найден или уже истёк. Откройте его снова из чата.');
        return;
      }

      var payload;
      try {
        payload = JSON.parse(raw);
      } catch (e) {
        showError('Повреждённые данные артефакта.');
        return;
      }

      try {
        localStorage.removeItem(STORAGE_PREFIX + key);
      } catch (e) {}

      var type = (payload.type || '').toLowerCase();
      var content = payload.content || '';
      var title = payload.title || 'Артефакт';
      var previewHtml = payload.previewHtml || '';
      titleEl.textContent = title;
      metaEl.textContent = type || 'unknown';
      document.title = title + ' — AstraChat';

      // 1) Уже отрисованный preview из чата — показываем как есть
      if (previewHtml && previewHtml.trim()) {
        var ph = previewHtml.trim();
        if (/^<!doctype/i.test(ph) || /<html[\s>]/i.test(ph)) {
          // Полноценный HTML-документ → fullscreen iframe
          chrome.style.display = 'none';
          var iframe = document.createElement('iframe');
          iframe.className = 'fullpage';
          iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads');
          iframe.srcdoc = ph;
          document.body.appendChild(iframe);
          return;
        }
        // Фрагмент (SVG / markdown html)
        if (/^<svg[\s>]/i.test(ph)) {
          stage.className = 'svg-only';
          stage.innerHTML = ph;
          return;
        }
        stage.innerHTML = ph;
        return;
      }

      // 2) Fallback: рендер по типу
      if (type === 'text/html' || type === 'application/vnd.code-html') {
        chrome.style.display = 'none';
        var iframe2 = document.createElement('iframe');
        iframe2.className = 'fullpage';
        iframe2.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads');
        var html = content;
        if (!/<!doctype/i.test(html) && !/<html[\s>]/i.test(html)) {
          html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:system-ui,sans-serif;padding:16px}</style></head><body>' + content + '</body></html>';
        }
        iframe2.srcdoc = html;
        document.body.appendChild(iframe2);
        return;
      }

      if (type === 'image/svg+xml') {
        stage.className = 'svg-only';
        stage.innerHTML = content;
        return;
      }

      if (type === 'text/markdown' || type === 'text/md') {
        // Простой markdown fallback без CDN
        var md = esc(content)
          .replace(/^### (.*)$/gm, '<h3>$1</h3>')
          .replace(/^## (.*)$/gm, '<h2>$1</h2>')
          .replace(/^# (.*)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br/>');
        stage.innerHTML = md;
        return;
      }

      if (type === 'application/vnd.mermaid') {
        var code = stripMermaidJunk(content);
        if (!window.mermaid) {
          showError('Mermaid не загрузился (/static/mermaid.min.js). Показан исходник.');
          stage.innerHTML = '<pre>' + esc(code) + '</pre>';
          return;
        }
        var id = 'mmd-' + Date.now();
        mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'neutral', suppressErrorRendering: true });
        mermaid
          .render(id, code)
          .then(function (res) {
            stage.className = 'svg-only';
            stage.innerHTML = res.svg;
          })
          .catch(function (e) {
            showError('Не удалось отрисовать Mermaid: ' + (e && e.message ? e.message : e));
            stage.innerHTML = '<pre>' + esc(code) + '</pre>';
          });
        return;
      }

      stage.innerHTML =
        '<p style="margin-top:0;color:#6b7280;font-size:14px">Для этого типа нет отдельного preview. Исходный код:</p><pre>' +
        esc(content) +
        '</pre>';
    })();
  </script>
</body>
</html>
