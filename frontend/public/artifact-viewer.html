<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Просмотр артефакта — AstraChat</title>
  <!-- Fallback-страница (markdown и пр.). Mermaid обычно уже SVG из chat-приложения. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e8eaed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #1f2937;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 650;
    }
    .meta {
      margin: 0 0 16px;
      font-size: 0.8rem;
      color: #6b7280;
    }
    #stage {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px;
      min-height: 280px;
      overflow: auto;
    }
    #stage.svg-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
    }
    #stage svg { max-width: 100%; height: auto; }
    #stage pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    #error {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    iframe.fill {
      width: 100%;
      min-height: 70vh;
      border: 0;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Артефакт</h1>
    <p class="meta" id="meta"></p>
    <div id="error"></div>
    <div id="stage"></div>
  </div>
  <script>
    (function () {
      var STORAGE_PREFIX = 'astrachat:artifact:';
      var params = new URLSearchParams(location.search);
      var key = params.get('key');
      var errorEl = document.getElementById('error');
      var stage = document.getElementById('stage');
      var titleEl = document.getElementById('title');
      var metaEl = document.getElementById('meta');

      function showError(msg) {
        errorEl.style.display = 'block';
        errorEl.textContent = msg;
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function stripStyleLines(code) {
        return code
          .split('\n')
          .filter(function (line) {
            return !/^\s*(style|classDef|class|linkStyle|click)\s+/i.test(line);
          })
          .join('\n')
          .trim();
      }

      function sanitizeMermaid(raw) {
        var code = String(raw || '').replace(/\r\n/g, '\n').trim();
        code = code.replace(/^```(?:mermaid)?\s*/i, '').replace(/\s*```$/i, '').trim();
        var start = code.search(
          /^\s*(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram(?:-v2)?|erDiagram|journey|gantt|pie|mindmap|timeline|gitGraph|xychart-beta|xychart)\b/im
        );
        if (start > 0) code = code.slice(start);
        return code.trim();
      }

      function renderMermaid(code) {
        stage.classList.add('svg-stage');
        var variants = [code, stripStyleLines(code)].filter(function (v, i, a) {
          return v && a.indexOf(v) === i;
        });

        function tryOne(i) {
          if (i >= variants.length) {
            showError('Не удалось отрисовать Mermaid.');
            stage.classList.remove('svg-stage');
            stage.innerHTML = '<pre>' + esc(code) + '</pre>';
            return;
          }
          var id = 'mmd-' + Date.now() + '-' + i;
          stage.innerHTML = '<div class="mermaid" id="' + id + '">' + esc(variants[i]) + '</div>';
          mermaid
            .run({ nodes: [document.getElementById(id)] })
            .then(function () {
              /* ok */
            })
            .catch(function () {
              tryOne(i + 1);
            });
        }

        if (!window.mermaid) {
          showError('Библиотека Mermaid не загрузилась (CDN). Откройте диаграмму снова из чата.');
          stage.innerHTML = '<pre>' + esc(code) + '</pre>';
          return;
        }
        mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'neutral', suppressErrorRendering: true });
        tryOne(0);
      }

      if (!key) {
        showError('Не указан ключ артефакта.');
        return;
      }

      var raw;
      try {
        raw = localStorage.getItem(STORAGE_PREFIX + key);
      } catch (e) {
        showError('Не удалось прочитать localStorage.');
        return;
      }
      if (!raw) {
        showError('Артефакт не найден или уже истёк. Откройте его снова из чата.');
        return;
      }

      var payload;
      try {
        payload = JSON.parse(raw);
      } catch (e) {
        showError('Повреждённые данные артефакта.');
        return;
      }

      try {
        localStorage.removeItem(STORAGE_PREFIX + key);
      } catch (e) {}

      var type = (payload.type || '').toLowerCase();
      var content = payload.content || '';
      var title = payload.title || 'Артефакт';
      titleEl.textContent = title;
      metaEl.textContent = type || 'unknown';
      document.title = title + ' — AstraChat';

      if (type === 'text/html' || type === 'application/vnd.code-html') {
        var iframe = document.createElement('iframe');
        iframe.className = 'fill';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
        var html = content;
        if (!/<!doctype/i.test(html) && !/<html[\s>]/i.test(html)) {
          html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:system-ui,sans-serif;padding:16px}</style></head><body>' + content + '</body></html>';
        }
        iframe.srcdoc = html;
        stage.innerHTML = '';
        stage.appendChild(iframe);
        return;
      }

      if (type === 'image/svg+xml') {
        stage.classList.add('svg-stage');
        stage.innerHTML = content;
        return;
      }

      if (type === 'text/markdown' || type === 'text/md') {
        if (window.marked) {
          stage.innerHTML = marked.parse(content);
        } else {
          stage.innerHTML = '<pre>' + esc(content) + '</pre>';
        }
        return;
      }

      if (type === 'application/vnd.mermaid' || /^\s*(graph|flowchart|sequenceDiagram|pie|xychart)/m.test(content)) {
        renderMermaid(sanitizeMermaid(content));
        return;
      }

      stage.innerHTML = '<p style="margin-top:0;color:#6b7280;font-size:14px">Интерактивный preview React в отдельной вкладке ограничен. Исходный код:</p><pre>' + esc(content) + '</pre>';
    })();
  </script>
</body>
</html>
